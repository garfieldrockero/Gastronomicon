# Compila y prueba Gastronomicón en GitHub Actions.
# En el equipo de desarrollo no hay SDK de Android ni Gradle: todo ocurre aquí. Primero
# pasan las pruebas del núcleo y solo si pasan se genera la APK.
#
# Tres jobs para no mezclar secretos con las pull requests:
#   - pruebas: en todo, sin secretos.
#   - apk-depuracion: en PRs y ejecuciones manuales que no son main, con clave de depuración.
#   - apk-firma: solo en main, con el environment «firma» y la clave fija.
name: APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Una ejecución por rama: si se sube otro commit, la anterior ya no interesa.
concurrency:
  group: apk-${{ github.ref }}
  # No se cancela una firma de main a medias; en PR y ramas sí interesa la última.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Solo lectura: este workflow compila, no escribe nada en el repositorio.
permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token del checkout no se queda en .git/config al alcance de Gradle
          # ni de las dependencias.
          persist-credentials: false

      - name: Preparar Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          # Siempre el último parche de seguridad de Temurin 17, no el que tenga el
          # runner en caché.
          check-latest: true

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # 9.8.1: primera versión libre que corrige GHSA-j5m7-59rp-24f5 (fallos de TLS
          # que no paraban la build y dejaban servir artefactos desde otro repositorio).
          gradle-version: '9.8.1'

      # Antes de empaquetar nada: si el núcleo no pasa sus pruebas, no hay APK.
      - name: Pruebas del núcleo
        run: gradle --no-daemon :core:test

      # Si fallan, el informe HTML queda como artefacto para no tener que adivinar.
      - name: Guardar el informe de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pruebas-fallidas
          path: core/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  # APK de prueba para PRs y ejecuciones manuales que no son main. Sin secretos y
  # con la clave de depuración: sirve para probar cambios, no para actualizar la app
  # instalada.
  apk-depuracion:
    if: github.ref != 'refs/heads/main'
    needs: pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.8.1'

      - name: Compilar la APK de prueba
        run: gradle --no-daemon assembleRelease

      - name: Comprobar manifiesto y configuración de red
        run: bash .github/scripts/comprobar-manifiesto.sh

      - name: Guardar la APK de prueba como artefacto
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Nombre distinto para que nadie la confunda con la APK firmada de main.
          name: gastronomicon-apk-pr
          path: |
            app/build/outputs/apk/release/*.apk
            !app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  # APK firmada con la clave fija. Solo en main y con el environment «firma»: GitHub
  # comprueba sus reglas (rama permitida, revisores) antes de entregar los secretos.
  apk-firma:
    if: github.ref == 'refs/heads/main'
    needs: pruebas
    environment: firma
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.8.1'

      # En main no se admite una APK sin la clave fija: si falta un secreto, se falla
      # con un mensaje claro en vez de publicar una APK de depuración que no se puede
      # instalar encima de la anterior.
      - name: Preparar la clave de firma
        shell: bash
        env:
          FIRMA_KEYSTORE_BASE64: ${{ secrets.FIRMA_KEYSTORE_BASE64 }}
          FIRMA_KEYSTORE_PASSWORD: ${{ secrets.FIRMA_KEYSTORE_PASSWORD }}
          FIRMA_KEY_ALIAS: ${{ secrets.FIRMA_KEY_ALIAS }}
          FIRMA_KEY_PASSWORD: ${{ secrets.FIRMA_KEY_PASSWORD }}
        run: |
          if [ -z "$FIRMA_KEYSTORE_BASE64" ] || [ -z "$FIRMA_KEYSTORE_PASSWORD" ] || [ -z "$FIRMA_KEY_ALIAS" ] || [ -z "$FIRMA_KEY_PASSWORD" ]; then
            echo "::error::Falta alguno de los secretos FIRMA_* del environment «firma»."
            exit 1
          fi
          printf '%s' "$FIRMA_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/firma.jks"
          if [ ! -s "$RUNNER_TEMP/firma.jks" ]; then
            echo "::error::El secreto FIRMA_KEYSTORE_BASE64 no produce un almacén de claves válido."
            exit 1
          fi
          # Validación temprana: si la contraseña no abre el keystore, mejor saberlo
          # aquí que en un error opaco de Gradle.
          if ! keytool -list -keystore "$RUNNER_TEMP/firma.jks" -storepass:env FIRMA_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            echo "::error::FIRMA_KEYSTORE_PASSWORD no abre el keystore o el archivo está dañado."
            exit 1
          fi
          echo "FIRMA_KEYSTORE_PATH=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
          echo "Se firma con la clave fija."

      # Las contraseñas y el alias solo llegan al proceso de Gradle por variables de
      # entorno, nunca por la línea de comandos ni al log.
      - name: Compilar la APK firmada
        env:
          FIRMA_KEYSTORE_PASSWORD: ${{ secrets.FIRMA_KEYSTORE_PASSWORD }}
          FIRMA_KEY_ALIAS: ${{ secrets.FIRMA_KEY_ALIAS }}
          FIRMA_KEY_PASSWORD: ${{ secrets.FIRMA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      # Manifiesto, permisos, copias, componentes exportados y configuración de red.
      - name: Comprobar manifiesto y configuración de red
        run: bash .github/scripts/comprobar-manifiesto.sh

      # La clave se borra siempre, aunque la compilación falle a medias.
      - name: Borrar la clave de firma
        if: always()
        run: rm -f "$RUNNER_TEMP/firma.jks"

      - name: Guardar la APK firmada como artefacto
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gastronomicon-apk
          # Excluir una APK sin firmar: si AGP la dejara, no debe confundirse con la buena.
          path: |
            app/build/outputs/apk/release/*.apk
            !app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 30
