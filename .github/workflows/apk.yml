# Compila y prueba Gastronomicón en GitHub Actions.
# En el equipo de desarrollo no hay SDK de Android ni Gradle: todo ocurre aquí. Primero
# pasan las pruebas del núcleo y solo si pasan se genera la APK.
#
# Tres jobs para no mezclar secretos con las pull requests:
#   - pruebas: en todo, sin secretos.
#   - apk-depuracion: en PRs y ramas que no son main, con clave de depuración.
#   - apk-firma: solo en main, con el environment «firma» y la clave fija.
name: APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Una ejecución por rama: si se sube otro commit, la anterior ya no interesa.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura: este workflow compila, no escribe nada en el repositorio.
permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token del checkout no se queda en .git/config al alcance de Gradle
          # ni de las dependencias.
          persist-credentials: false

      - name: Preparar Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          # Siempre el último parche de seguridad de Temurin 17, no el que tenga el
          # runner en caché.
          check-latest: true

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # 9.8.1: primera versión libre que corrige GHSA-j5m7-59rp-24f5 (fallos de TLS
          # que no paraban la build y dejaban servir artefactos desde otro repositorio).
          gradle-version: '9.8.1'

      # Antes de empaquetar nada: si el núcleo no pasa sus pruebas, no hay APK.
      - name: Pruebas del núcleo
        run: gradle --no-daemon :core:test

  # APK de prueba para PRs y ramas que no son main. Sin secretos y con la clave de
  # depuración: sirve para probar cambios, no para actualizar la app instalada.
  apk-depuracion:
    if: github.ref != 'refs/heads/main'
    needs: pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.8.1'

      - name: Compilar la APK de prueba
        run: gradle --no-daemon assembleRelease

      - name: Guardar la APK de prueba como artefacto
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Nombre distinto para que nadie la confunda con la APK firmada de main.
          name: gastronomicon-apk-pr
          path: |
            app/build/outputs/apk/release/*.apk
            !app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  # APK firmada con la clave fija. Solo en main y con el environment «firma»: GitHub
  # comprueba sus reglas (rama permitida, revisores) antes de entregar los secretos.
  apk-firma:
    if: github.ref == 'refs/heads/main'
    needs: pruebas
    environment: firma
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.8.1'

      # En main no se admite una APK sin la clave fija: si falta un secreto, se falla
      # con un mensaje claro en vez de publicar una APK de depuración que no se puede
      # instalar encima de la anterior.
      - name: Preparar la clave de firma
        shell: bash
        env:
          FIRMA_KEYSTORE_BASE64: ${{ secrets.FIRMA_KEYSTORE_BASE64 }}
          FIRMA_KEYSTORE_PASSWORD: ${{ secrets.FIRMA_KEYSTORE_PASSWORD }}
          FIRMA_KEY_ALIAS: ${{ secrets.FIRMA_KEY_ALIAS }}
          FIRMA_KEY_PASSWORD: ${{ secrets.FIRMA_KEY_PASSWORD }}
        run: |
          if [ -z "$FIRMA_KEYSTORE_BASE64" ] || [ -z "$FIRMA_KEYSTORE_PASSWORD" ] || [ -z "$FIRMA_KEY_ALIAS" ] || [ -z "$FIRMA_KEY_PASSWORD" ]; then
            echo "::error::Falta alguno de los secretos FIRMA_* del environment «firma»."
            exit 1
          fi
          printf '%s' "$FIRMA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/firma.jks"
          if [ ! -s "$RUNNER_TEMP/firma.jks" ]; then
            echo "::error::El secreto FIRMA_KEYSTORE_BASE64 no produce un almacén de claves válido."
            exit 1
          fi
          echo "FIRMA_KEYSTORE_PATH=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
          echo "Se firma con la clave fija."

      # Las contraseñas y el alias solo llegan al proceso de Gradle por variables de
      # entorno, nunca por la línea de comandos ni al log.
      - name: Compilar la APK firmada
        env:
          FIRMA_KEYSTORE_PASSWORD: ${{ secrets.FIRMA_KEYSTORE_PASSWORD }}
          FIRMA_KEY_ALIAS: ${{ secrets.FIRMA_KEY_ALIAS }}
          FIRMA_KEY_PASSWORD: ${{ secrets.FIRMA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      # La app solo debe poder hablar con el servidor Mealie que configure cada persona.
      # Si una dependencia nueva mete permisos de más, si se pierde la configuración de
      # red o si alguien activa el tráfico en claro, falla.
      - name: Comprobar permisos y red del manifiesto final
        shell: bash
        run: |
          m=$(find app/build/intermediates -path '*merged_manifest*' -path '*elease*' -name AndroidManifest.xml | head -n 1)
          if [ -z "$m" ]; then
            echo "::error::No se encuentra el manifiesto final del release."
            exit 1
          fi
          echo "Manifiesto final: $m"

          # Se juntan las líneas porque el manifiesto combinado puede partir un elemento.
          permisos=$(tr '\n' ' ' < "$m" | grep -oE '<uses-permission[^>]*>' | sed -E 's/.*android:name="([^"]+)".*/\1/' | sort -u || true)
          echo "Permisos declarados:"
          if [ -z "$permisos" ]; then
            echo "  (ninguno)"
          else
            echo "$permisos" | sed 's/^/  /'
          fi

          # Solo estos permisos están aprobados. DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
          # la añade AndroidX Core al manifiesto final: es un permiso signature de la
          # propia app para sus receptores no exportados y no da acceso a nada externo.
          # Si algún día se aprueban las notificaciones, hay que añadir aquí
          # android.permission.POST_NOTIFICATIONS a propósito.
          permitidos="android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE io.github.garfieldrockero.gastronomicon.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case " $permitidos " in
              *" $p "*) ;;
              *)
                echo "::error::Permiso no aprobado en el manifiesto: $p"
                exit 1
                ;;
            esac
          done <<< "$permisos"

          if grep -qE "android:usesCleartextTraffic=['\"]true['\"]" "$m"; then
            echo "::error::El manifiesto activa el tráfico HTTP en claro para toda la app."
            exit 1
          fi

          if ! grep -qE "android:networkSecurityConfig=['\"]@xml/seguridad_red['\"]" "$m"; then
            echo "::error::Falta android:networkSecurityConfig=\"@xml/seguridad_red\" en el manifiesto."
            exit 1
          fi

          if grep -qE "android:debuggable=['\"]true['\"]" "$m"; then
            echo "::error::El manifiesto de release permite depurar la app."
            exit 1
          fi

          # allowBackup=false no basta en Android 12+: la transferencia directa a otro
          # móvil se controla con dataExtractionRules, y esta app no debe exportar nada.
          if ! grep -qE "android:allowBackup=['\"]false['\"]" "$m"; then
            echo "::error::El manifiesto no desactiva las copias de seguridad."
            exit 1
          fi
          if ! grep -qE "android:dataExtractionRules=['\"]@xml/extraccion_datos['\"]" "$m"; then
            echo "::error::Falta android:dataExtractionRules=\"@xml/extraccion_datos\" en el manifiesto."
            exit 1
          fi

          # Solo el launcher y el receptor de perfil de AndroidX pueden estar exportados.
          componentes=$(tr '\n' ' ' < "$m" | grep -oE '<(activity|activity-alias|service|receiver|provider)[^>]*>' || true)
          while IFS= read -r c; do
            [ -z "$c" ] && continue
            if printf '%s' "$c" | grep -qE "android:exported=['\"]true['\"]"; then
              nombre=$(printf '%s' "$c" | sed -nE 's/.*android:name="([^"]+)".*/\1/p')
              case "$nombre" in
                ".MainActivity"|"io.github.garfieldrockero.gastronomicon.MainActivity"|"androidx.profileinstaller.ProfileInstallReceiver") ;;
                *)
                  echo "::error::Componente exportado no aprobado: ${nombre:-desconocido}"
                  exit 1
                  ;;
              esac
            fi
          done <<< "$componentes"

          # Defensa en profundidad: además del manifiesto, la configuración de red no
          # puede habilitar HTTP ni confiar en certificados instalados por el usuario.
          red=app/src/main/res/xml/seguridad_red.xml
          if [ ! -f "$red" ]; then
            echo "::error::No se encuentra $red."
            exit 1
          fi
          if grep -qE "cleartextTrafficPermitted=['\"]true['\"]" "$red"; then
            echo "::error::seguridad_red.xml permite tráfico HTTP en claro."
            exit 1
          fi
          if grep -qE "src=['\"]user['\"]" "$red"; then
            echo "::error::seguridad_red.xml confía en certificados de usuario."
            exit 1
          fi

          # La regla de extracción de datos también debe estar en el código, no solo
          # referenciada en el manifiesto.
          extraccion=app/src/main/res/xml/extraccion_datos.xml
          if [ ! -f "$extraccion" ]; then
            echo "::error::No se encuentra $extraccion."
            exit 1
          fi

          echo "Manifiesto correcto: permisos aprobados, sin tráfico en claro, sin depuración, sin copias y con la configuración de red."

      # La clave se borra siempre, aunque la compilación falle a medias.
      - name: Borrar la clave de firma
        if: always()
        run: rm -f "$RUNNER_TEMP/firma.jks"

      - name: Guardar la APK firmada como artefacto
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gastronomicon-apk
          # Excluir una APK sin firmar: si AGP la dejara, no debe confundirse con la buena.
          path: |
            app/build/outputs/apk/release/*.apk
            !app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 30
